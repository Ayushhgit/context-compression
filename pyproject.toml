[project]
name = "context-compression"
version = "0.1.0"
description = "Adaptive Context Compression for LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=1.0.0",
    "numpy>=2.4.2",
    "sentence-transformers>=5.2.3",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
